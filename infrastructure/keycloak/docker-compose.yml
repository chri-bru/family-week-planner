services:
  keycloak:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: keycloak
    env_file: .env
    command:
      - start
      - --optimized
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_DATABASE}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PW}

      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_PROXY: edge
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_PORT: 5566
    ports:
      - 5566:5566

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.keycloak.rule=Host(`${KC_HOSTNAME}`)"
    #   - "traefik.http.routers.keycloak.entrypoints=websecure"
    #   - "traefik.http.routers.keycloak.tls.certresolver=le"
    #   - "traefik.http.services.keycloak.loadbalancer.server.port=5566"

    restart: unless-stopped
